plugins {
    id 'groovy'
    id 'java-library'
}

group = 'org.paulmarquardt'
version = '2.0.5'

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.29'
    implementation 'org.apache.groovy:groovy-json:4.0.29'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.github.dpaukov:combinatoricslib3:3.4.0'
    implementation 'org.json:json:20260522'
    implementation 'org.apache.commons:commons-collections4:4.6.0'

    testImplementation 'junit:junit:4.13.2'
}

def sampleApplications = [
    runTest              : [mainClass: 'Test'],
    runEmbeddedRows      : [mainClass: 'EmbeddedRows', standardInput: true],
    runCoolRows          : [mainClass: 'FindCoolRows', standardInput: true],
    runGlassWork         : [mainClass: 'GlassWork', standardInput: true],
    runTransformationWork: [mainClass: 'TransformationWork', standardInput: true],
    runRows              : [mainClass: 'Rows', standardInput: true],
    runRowScratch        : [mainClass: 'RowScratch', standardInput: true],
    runRowTests          : [mainClass: 'RowTests', standardInput: true],
    runCM                : [mainClass: 'CM', standardInput: true],
    runQuickTour         : [mainClass: 'QuickTour'],
    runTestTransString   : [mainClass: 'TestTransString'],
    runScales            : [mainClass: 'Scales']
]

sampleApplications.each { taskName, configuration ->
    tasks.register(taskName, JavaExec) {
        group = 'application'
        description = "Runs ${configuration.mainClass}."
        classpath = sourceSets.main.runtimeClasspath
        mainClass = configuration.mainClass
        if (configuration.standardInput) {
            standardInput = System.in
        }
    }
}
